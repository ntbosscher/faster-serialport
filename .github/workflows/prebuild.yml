name: prebuild

# Builds the native addon for every shipped platform/arch and bundles the
# results into a single downloadable "prebuilds" artifact. Download it into the
# repo root (so prebuilds/ is populated) before running `npm publish`.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
#          - { name: darwin-arm64, os: macos-14,       target_arch: arm64, node_arch: arm64 }
#          - { name: darwin-x64,   os: macos-13,       target_arch: x64,   node_arch: x64 }
          - { name: win32-x64,    os: windows-latest, target_arch: x64,   node_arch: x64,   msystem: MINGW64,    mingw_dir: mingw64,    mingw_pkg: mingw-w64-x86_64-gcc }
          - { name: win32-ia32,   os: windows-latest, target_arch: ia32,  node_arch: x86,   msystem: MINGW32,    mingw_dir: mingw32,    mingw_pkg: mingw-w64-i686-gcc }
          - { name: win32-arm64,  os: windows-11-arm, target_arch: arm64, node_arch: arm64, msystem: CLANGARM64, mingw_dir: clangarm64, mingw_pkg: mingw-w64-clang-aarch64-gcc-compat }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-serial/go.mod

      # Windows cgo builds the Go c-archive with gcc; install a known mingw so
      # the compiler (and its arch) are deterministic rather than whatever the
      # runner happens to ship. MINGW64 gives x86_64 gcc, MINGW32 gives i686.
      - name: Set up mingw (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.mingw_pkg }}
      # The build steps run in the normal Windows shell, not `msys2 {0}`, so put
      # the msystem's gcc on PATH for them. Its frontend is plain `gcc`.
      - name: Point cgo at mingw (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\${{ matrix.mingw_dir }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: ${{ matrix.node_arch }}

      # binding.gyp at the repo root makes npm implicitly run `node-gyp rebuild`
      # on install; skip it so the addon is built only after build:go generates
      # build-go/libserial.{a,h}.
      - run: npm ci --ignore-scripts

      - name: Build Go archive
        run: npm run build:go
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}

      - name: Build addon
        run: npx node-gyp rebuild --arch=${{ matrix.target_arch }}

      - name: Stage prebuild
        run: node scripts/copy-prebuild.js
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.name }}
          path: prebuilds/

  bundle:
    name: bundle prebuilds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          merge-multiple: true
          path: prebuilds
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds/
